services:
  postgres:
    image: postgres:16-alpine
    container_name: cookinghub-postgres
    environment:
      POSTGRES_DB: cookinghub
      POSTGRES_USER: cookinghub
      POSTGRES_PASSWORD: cookinghub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
